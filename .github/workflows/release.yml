name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Open or publish release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

      - name: Dispatch package publish
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: gh workflow run publish.yml --repo "${{ github.repository }}" --ref main -f tag_name="${{ steps.release.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
